<!DOCTYPE html>
<html lang="ko">
  <head>
    <!-- Default base = site root. When served behind the portal proxy
         (/p/lilak_gui/), the portal injects a <base> with that prefix BEFORE this
         one, and browsers honor the first <base> — so relative assets resolve
         under the proxy. Combined with Vite `base: './'`. -->
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LILAK GUI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
