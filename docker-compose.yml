# Run the whole LILAK Web Portal stack from one image.
#
#   cd ~/web_service
#   cp .env.example .env          # then edit the secrets (+ optional PORTAL_DATA_DIR)
#   docker compose up -d --build  # build + start; portal at http://<host>:8025
#
# The image bakes all the CODE; all STATE lives in ONE host folder bind-mounted at
# /app/data (accounts + service registry + every service's data). That folder is
# OUTSIDE Docker, so each server keeps its own data — back it up / sync it / move it
# independently of the image. Default: ./portal-data next to this file; override
# with PORTAL_DATA_DIR (e.g. an absolute path on a big disk: /srv/lilak/data).
services:
  portal:
    build:
      context: .                                   # web_service/ — holds every repo
      dockerfile: service_manager/deploy/Dockerfile
    image: lilak-web-portal:latest
    ports:
      - "${PORTAL_BIND:-127.0.0.1}:${PORTAL_PORT:-8025}:8025"  # localhost front door; service ports stay internal
    volumes:
      # HOST folder ↔ container — all data lives here, on the host, per server.
      - ${PORTAL_DATA_DIR:-./portal-data}:/app/data
      - sci-data:/sci                              # shared with sci-runner: nptoy reads sim results here
    env_file:
      - .env
    environment:
      # nptoy delegates heavy nptool/Geant4 jobs to the internal sci-runner.
      # Presence of SCI_RUNNER_URL switches nptoy from local mode to sci mode.
      SCI_RUNNER_URL: http://sci-runner:8100
      SCI_SHARED_DIR: /sci
      SCI_TOKEN: ${SCI_TOKEN:-}
      NPTOY_NPTOOL_ROOT: /app/nptool_cens
      NPTOY_PROJECTS_DIR: /app/nptool_cens/Projects
    restart: unless-stopped

  # Heavy simulation backend (ROOT + Geant4 + nptool) shared by nptoy (and later
  # g4toy). NOT published — the portal reaches it internally at http://sci-runner:8100.
  # A full build is long (Geant4 + nptool compile); build it on the x86_64 server.
  # Enable with:  docker compose --profile sci up -d --build
  sci-runner:
    build:
      context: ./sci-runner
    image: lilak-sci-runner:latest
    profiles: ["sci"]                              # opt-in: only builds/starts when asked
    volumes:
      - sci-data:/data
      - ${PORTAL_DATA_DIR:-./portal-data}:/portal-data:ro
      # Interactive workspace: a HOST folder you own, mounted read-write at /work, so
      # files you make inside the container (root/geant4/nptool) land on the host and
      # are reachable without docker. Override the host path with SCI_WORK_DIR.
      - ${SCI_WORK_DIR:-./sci-work}:/work
    environment:
      SCI_PORT: "8100"
      SCI_TOKEN: "${SCI_TOKEN:-}"
      PORTAL_DATA: /portal-data
    restart: unless-stopped

volumes:
  sci-data:
