<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lilak portal · sidebar A</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Joungkyun/font-d2coding/d2coding.css">
<style>
/* lilak_ui kit tokens (theme/tokens.js bright + applyTheme.js FONT_DEFAULTS) */
:root{
  --font-sans:Pretendard,'IBM Plex Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:'D2 coding','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius-md:3px;--radius-lg:5px;
  --app-bg:#f8fafc;--surface:#fff;--surface-2:#f1f5f9;--surface-3:#e2e8f0;
  --border-default:#e2e8f0;--border-subtle:#f1f5f9;--border-strong:#cbd5e1;--border-focus:#3b82f6;
  --text-primary:#1e293b;--text-secondary:#475569;--text-muted:#94a3b8;--text-emphasis:#0f172a;
  --accent:#2563eb;--success-bg:#d1fae5;--success-text:#065f46;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --shadow-on:0 0 0 2px rgba(59,130,246,.15);
}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;font-family:var(--font-sans);font-size:13px;color:var(--text-primary);background:var(--app-bg)}
button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;text-align:left}
aside{width:260px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface-2);border-right:1px solid var(--border-default)}
.brand{height:50px;padding:0 17px;white-space:nowrap;display:flex;align-items:center;gap:10px}
.mark{width:30px;height:23px;color:var(--text-emphasis);flex-shrink:0}
.brand b{font-size:15px;font-weight:700;color:var(--text-emphasis)}.brand .sub{font-size:15px;color:var(--text-secondary)}
.brand b,.brand .sub{transition:opacity .15s}body.mini .brand b,body.mini .brand .sub{opacity:0}
.logo-btn{display:flex;align-items:center;gap:8px;padding:4px 6px;margin-left:-6px;border-radius:var(--radius-md)}.logo-btn:hover{background:var(--surface-2)}
aside{transition:width .15s;overflow:hidden}
body.mini aside{width:64px}
/* collapsed = the same layout clipped to 64px: nothing moves, labels just fade */
.txt,.svc .chev,.pop,.out,.search input,.grp>*,.proj .m{transition:opacity .15s}
body.mini :is(.txt,.svc .chev,.pop,.out,.search input,.grp>:not(.gchev)){opacity:0;pointer-events:none}
body.mini .projs{display:none}
/* collapsed: cards dissolve into the bar; the selected one keeps a ring on its icon */
.card-svc{transition:background .15s,border-color .15s,box-shadow .15s}.av{transition:box-shadow .15s}
body.mini .card-svc{background:transparent;border-color:transparent;box-shadow:none}
body.mini .card-svc.on .av{box-shadow:0 0 0 2px var(--surface-2),0 0 0 4px var(--border-focus)}
.search{gap:10px;padding:7px 9px;cursor:text}
/* keyboard focus: ring the whole card, not just the inner button */
.card-svc:has(> .svc:focus-visible),.prow:has(> .proj:focus-visible){border-color:var(--border-focus);box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.svc:focus-visible,.proj:focus-visible{outline:none}
.grp:focus-visible{outline:none}.grp:focus-visible .gchev{border-color:var(--border-focus);box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.search:focus-within{border-color:var(--border-focus);box-shadow:var(--shadow-on)}
.search input{flex:1;min-width:0;height:24px;padding:0;border:0;outline:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--text-emphasis)}.search input::placeholder{color:var(--text-secondary);font-weight:600}
nav{flex:1;overflow-y:auto;padding:2px 10px 10px;display:flex;flex-direction:column;gap:4px}
.card-svc{flex-shrink:0;background:var(--surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .15s,border-color .15s}
.card-svc:hover{border-color:var(--border-strong)}
.card-svc.on{border-color:var(--border-focus);box-shadow:var(--shadow-on)}
.card-svc{display:flex;align-items:center}
.svc{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:7px 9px}
.av.sys{background:var(--text-secondary)}
.av{position:relative;flex-shrink:0;width:30px;height:30px;border-radius:var(--radius-md);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.av i{position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface);background:#10b981}
.txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600;color:var(--text-emphasis)}.txt small{margin-left:4px;font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--text-secondary)}
.chev{flex-shrink:0;transition:transform .15s}.open .chev{transform:rotate(90deg)}
.projs{flex-shrink:0;margin:0 0 4px 16px;display:flex;flex-direction:column;gap:4px}
/* slide: --h is the list's measured height, set from JS right before the animation */
/* slide: the list's box grows/shrinks (--h = measured height, set from JS) while its
   cards travel down from / back up under the card above, so they move instead of fading */
:is(.projs,.gitems):is(.enter,.leave){overflow:hidden}
:is(.projs,.gitems).enter{animation:grow .24s cubic-bezier(.2,.7,.3,1)}
:is(.projs,.gitems).enter>*{animation:down .24s cubic-bezier(.2,.7,.3,1)}
:is(.projs,.gitems).leave{animation:shrink .2s cubic-bezier(.5,0,.8,.4) forwards}
:is(.projs,.gitems).leave>*{animation:up .2s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes grow{from{max-height:0}to{max-height:var(--h)}}
@keyframes shrink{from{max-height:var(--h)}to{max-height:0}}
@keyframes down{from{transform:translateY(calc(-1 * var(--h)))}to{transform:none}}
@keyframes up{from{transform:none}to{transform:translateY(calc(-1 * var(--h)))}}
@media (prefers-reduced-motion:reduce){:is(.projs,.gitems):is(.enter,.leave),:is(.projs,.gitems):is(.enter,.leave)>*{animation-duration:1ms}}
.gitems{display:flex;flex-direction:column;gap:4px}
.prow{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-md);box-shadow:0 1px 2px rgba(15,23,42,.08);transition:border-color .15s}
.prow:hover{border-color:var(--text-muted)}.prow.on{background:var(--accent);border-color:var(--accent)}
.pop{flex-shrink:0;width:26px;height:26px;margin-right:4px;display:grid;place-items:center;border-radius:var(--radius-md);color:var(--text-muted);opacity:0;transition:opacity .1s}
.card-svc:hover .pop,.prow:hover .pop,.on>.pop,.pop:focus-visible{opacity:1}.pop:hover{color:var(--text-emphasis)}
.prow.on .pop{color:#dbeafe}.prow.on .pop:hover{color:#fff}
.proj{flex:1;min-width:0;height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;font-weight:500;color:var(--text-primary)}
.on>.proj{color:#fff;font-weight:600}
.sw{margin-left:auto;width:26px;height:15px;border-radius:999px;background:var(--border-strong);position:relative;transition:background .15s}.sw::after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .15s}.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(11px)}
.proj .dot{flex-shrink:0;width:7px;height:7px;border-radius:2px;margin:0 3px}.on>.proj .dot{box-shadow:0 0 0 1.5px #fff}
.proj .ico{flex-shrink:0;display:grid;place-items:center;width:13px;color:var(--text-secondary)}.on>.proj .ico{color:#dbeafe}
.proj .m{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}.on>.proj .m{color:#dbeafe}
.me{flex-shrink:0;padding:8px 10px 10px;border-top:1px solid var(--border-default)}
.out{flex-shrink:0;width:24px;height:24px;margin-right:8px;display:grid;place-items:center;border-radius:var(--radius-md);color:var(--text-secondary)}.out:hover{color:var(--text-emphasis)}
.av.login{background:var(--accent)}
.av.user{background:var(--border-strong);color:var(--text-secondary);font-size:11px}
main{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px;gap:8px}
header{height:44px;flex-shrink:0;padding:0 12px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
header .av.sys{background:var(--text-secondary)}
.av{width:24px;height:24px;font-size:12px}header .av i{display:none}
header .n{font-size:14px;font-weight:700;color:var(--text-emphasis)}header .p{font-family:var(--font-mono);font-size:13px;color:var(--text-secondary)}
.pill{margin-left:6px;padding:1px 6px;border-radius:var(--radius-md);background:var(--success-bg);color:var(--success-text);font-family:var(--font-mono);font-size:11px;font-weight:600}
.btn{margin-left:auto;height:28px;padding:0 10px;border:1px solid var(--border-default);border-radius:var(--radius-md);color:var(--text-secondary);display:flex;align-items:center;gap:6px;background:var(--surface)}
.btn:hover{background:var(--surface-2)}
.body{flex:1;min-height:0;overflow:auto}
.panel{height:100%;background:var(--surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.panel-h{padding:7px 12px;border-bottom:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:12px;color:var(--text-primary);display:flex;gap:8px}
.panel-h span{color:var(--text-muted)}
.picker{padding:18px}.picker h2{margin:0 0 6px;font-size:18px;color:var(--text-emphasis)}.picker p{margin:0 0 18px;color:var(--text-secondary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.card{padding:10px 12px;background:var(--surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--border-focus);box-shadow:var(--shadow-on)}.card b{font-size:14px;color:var(--text-emphasis)}.card small{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}
.frame{flex:1;margin:8px;border:1px dashed var(--border-strong);border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text-secondary)}
.frame code{font-family:var(--font-mono);font-size:12px;color:var(--text-muted)}
.frame b{font-size:16px;color:var(--text-primary)}
.gbox{flex-shrink:0;margin:6px -10px 0;padding:0 10px 8px;display:flex;flex-direction:column;gap:4px;background:rgba(148,163,184,.16);border-top:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong)}
body.mini .gbox{background:transparent;border-bottom-color:transparent}
.gbox{transition:background .15s,border-color .15s}
.grp{flex-shrink:0;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 10px;font-size:13px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
.grp:hover{color:var(--text-emphasis)}.gchev{flex-shrink:0;width:24px;height:24px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-md)}.grp:hover .gchev{border-color:var(--text-muted)}
.grp .chev{width:14px;height:14px;stroke:var(--text-emphasis);stroke-width:2.6}.grp small{margin-left:auto;font-family:var(--font-mono);font-size:11px;font-weight:400}
.auth{height:100%;display:grid;place-items:center;padding:24px}
/* slot sized to the taller signup card; the card hangs from its top so the tabs never move between modes */
.auth-slot{height:380px;display:flex;align-items:flex-start}
.auth-card{width:340px;padding:28px 24px 24px;background:var(--surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.auth-head{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:4px}.auth-mark{width:36px;height:28px}
.auth-head b{font-size:18px;font-weight:700;color:var(--text-emphasis)}.auth-head span{font-size:18px;color:var(--text-secondary)}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:3px;background:var(--surface-2);border-radius:var(--radius-md)}
.tabs button{height:30px;text-align:center;border-radius:var(--radius-md);font-weight:600;color:var(--text-secondary)}.tabs button.on{background:var(--surface);color:var(--text-emphasis);box-shadow:var(--shadow)}
.auth form{display:flex;flex-direction:column;gap:8px}
.auth input{height:38px;padding:0 11px;border:1px solid var(--border-default);border-radius:var(--radius-md);font:inherit;color:var(--text-primary);background:var(--surface);outline:0}
.auth input:focus{border-color:var(--border-focus);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.auth .primary{height:38px;margin-top:4px;text-align:center;border-radius:var(--radius-md);background:var(--accent);color:#fff;font-weight:600}.auth .primary:hover{background:#1d4ed8}
.auth .err{font-size:12px;color:#b91c1c}
.allfold{margin-left:auto;width:28px;height:28px;display:grid;place-items:center;border-radius:var(--radius-md);color:var(--text-secondary);transition:opacity .15s}.allfold:hover{color:var(--text-emphasis)}
body.mini .allfold{opacity:0;pointer-events:none}
.empty{padding:16px 6px;color:var(--text-secondary)}
</style>
</head>

      <div class="tabs" role="tablist"><button role="tab" data-auth="login" aria-selected="${!up}" class="${up ? '' : 'on'}">로그인</button><button role="tab" data-auth="signup" aria-selected="${up}" class="${up ? 'on' : ''}">가입</button></div>
      <form id="authForm" autocomplete="${up ? 'off' : 'on'}">
        <input name="${up ? 'su_id' : 'username'}" placeholder="아이디" aria-label="아이디" autocomplete="${up ? 'off' : 'username'}" required>
        ${up ? '<input name="su_email" type="email" placeholder="이메일" aria-label="이메일" autocomplete="off" required>' : ''}
        <input name="${up ? 'su_pw' : 'password'}" type="password" placeholder="비밀번호" aria-label="비밀번호" autocomplete="${up ? 'new-password' : 'current-password'}" required>
        ${up ? '<input name="su_code" placeholder="허용 코드 (선택)" aria-label="허용 코드 (선택)" autocomplete="off">' : ''}
        ${st.authErr ? `<div class="err">${esc(st.authErr)}</div>` : ''}
        <button class="primary" type="submit">${up ? '계정 만들기' : '로그인'}</button>
      </form></div></div></div></div>`;
    return;
  }
  if (SYS[st.sel]) { $('body').innerHTML = `<div class="panel"><div class="frame"><b>${SYS[st.sel]}</b><span>화면이 여기에 들어옵니다</span></div></div>`; return; }
  const cur = find(st.sel);
  if (cur.sys && st.proj) { $('body').innerHTML = `<div class="panel"><div class="frame"><b>${esc(st.proj)}</b><span>${esc(MODE.hints[st.proj])}</span></div></div>`; return; }
  $('body').innerHTML = cur.projects && !st.proj
    ? `<div class="panel"><div class="picker"><h2>${cur.sys ? '모드' : '프로젝트'}를 선택하세요</h2><p>왼쪽 목록이나 아래 카드에서 고를 수 있어요.</p><div class="grid">` +
      cur.projects.map(([p, m]) => `<button class="card" data-svc="${cur.id}" data-proj="${esc(p)}"><b>${esc(p)}</b><small>${m || '&nbsp;'}</small></button>`).join('') + '</div></div></div>'
    : `<div class="panel"><div class="frame"><code>${st.proj ? `/pp/${cur.id}/${esc(st.proj)}/` : `/p/${cur.id}/`}</code><b>${esc(cur.name)}${st.proj ? ' / ' + esc(st.proj) : ''}</b><span>서비스 화면이 여기에 들어옵니다</span></div></div>`;
}

document.addEventListener('click', (e) => {
  const auth = e.target.closest('[data-auth]');
  if (auth) { st.authMode = auth.dataset.auth; st.authErr = ''; render(); document.querySelector('#authForm input').focus(); return; }
  const act = e.target.closest('[data-act]');
  if (act) {
    if (act.dataset.act === 'grpmode') {
      st.flat = !st.flat;
      try { localStorage.setItem('portal-flat', st.flat ? '1' : ''); } catch {}
      render(); return;
    }
    if (act.dataset.act === 'logout') { st.user = null; st.authMode = 'login'; render(); }
    document.querySelector('#authForm input')?.focus();
    return;
  }
  const grp = e.target.closest('[data-grp]');
  if (grp) {
    const g = grp.dataset.grp;
    const items = [...document.querySelectorAll('.gitems')].find((el) => el.dataset.gfor === g);
    const shutNow = !items;                          // what's on screen is the truth (search may force-open)
    if (st.q) st.qshut[g] = !shutNow;
    else { st.shut[g] = !shutNow; try { localStorage.setItem('portal-groups-shut', JSON.stringify(st.shut)); } catch {} }
    if (items) {                      // closing: slide the cards up, then re-render
      items.style.setProperty('--h', items.offsetHeight + 'px');
      items.classList.replace('enter', 'leave') || items.classList.add('leave');
      items.addEventListener('animationend', (e) => { if (e.target === items) render(); });
      grp.classList.remove('open');
      return;
    }
    st.justOpenedG = g;
    render(); return;
  }
  const pop = e.target.closest('[data-pop]');
  if (pop) { window.open(pop.dataset.pop, '_blank'); return; }
  const b = e.target.closest('[data-svc]');
  if (!b) return;
  const id = b.dataset.svc, s = find(id);
  if (SYS[id]) { st.sel = id; st.proj = null; }
  else if (b.dataset.proj) { st.sel = id; st.proj = b.dataset.proj; st.open[id] = true; }
  else if (s.projects) {
    st.sel = id; st.proj = null;
    const list = document.querySelector(`.projs[data-for="${id}"]`);
    const setOpen = (v) => { if (st.q) st.qopen[id] = v; else st.open[id] = v; };
    if (list) {                                     // closing: slide up first, then drop it from the DOM
      setOpen(false);
      list.style.setProperty('--h', list.offsetHeight + 'px');
      list.classList.replace('enter', 'leave') || list.classList.add('leave');
      list.addEventListener('animationend', (e) => { if (e.target === list) render(); });
      b.closest('.card-svc').querySelector('.svc').classList.remove('open');
      return;
    }
    setOpen(true); st.justOpened = id;
  }
  else { st.sel = id; st.proj = null; }
  render();
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'authForm') return;
  e.preventDefault();
  // ponytail: mock — any id/password logs in; wire to /api/auth/login (and signup) in the portal
  const id = e.target.elements[0].value.trim();
  st.user = { initials: id.slice(0, 2).toUpperCase(), name: id }; st.authErr = '';
  render();
});
SEARCH.querySelector('input').addEventListener('input', (e) => { st.q = e.target.value.trim(); st.qopen = {}; st.qshut = {}; render(); e.target.focus(); });  // render re-parents the search card
const fold = () => {
  const mini = document.body.classList.toggle('mini');
  $('fold').setAttribute('aria-expanded', String(!mini));
  if (mini) { st.open = {}; render(); }  // collapsing the bar also closes every service's project list
  try { localStorage.setItem('portal-mini', mini ? '1' : ''); } catch {}
};
$('fold').addEventListener('click', fold);
$('allfold').addEventListener('click', () => {
  if (st.flat) {                                 // no groups: toggle every project list instead
    const multi = SERVICES.filter((s) => s.projects);
    const close = multi.some((s) => st.open[s.id]);
    st.open = close ? {} : Object.fromEntries(multi.map((s) => [s.id, true]));
    render(); return;
  }
  const groups = [...new Set(SERVICES.map((s) => s.group || '기타'))];
  const close = groups.some((g) => !st.shut[g]);
  groups.forEach((g) => { st.shut[g] = close; });
  if (close) st.open = {};                      // folding everything closes project lists too
  try { localStorage.setItem('portal-groups-shut', JSON.stringify(st.shut)); } catch {}
  render();
});
SEARCH.addEventListener('click', () => { if (document.body.classList.contains('mini')) { fold(); SEARCH.querySelector('input').focus(); } });
document.addEventListener('keydown', (e) => {
  const a = document.activeElement, typing = /INPUT|TEXTAREA/.test(a.tagName);
  // ₩ on a Korean layout is the \ key; either one folds the bar (not while typing)
  if ((e.key === '₩' || e.key === '\\') && !typing) { e.preventDefault(); fold(); return; }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  if (typing && a.id !== 'q') return;              // arrows stay in the login form's fields
  const items = [...document.querySelectorAll(NAV_ITEMS)].filter((x) =>
    x.offsetParent && !(document.body.classList.contains('mini') && x.id === 'q'));
  if (!items.length) return;
  e.preventDefault();
  let i = items.indexOf(a);
  if (i < 0) i = Math.max(0, items.findIndex((x) => x.closest('.on')));   // start from the selected card
  else i = Math.min(items.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)));
  items[i].focus();
  items[i].scrollIntoView({ block: 'nearest' });
});
// Space/Enter on a focused card is the button's own click: select it or open/close its list
try { if (localStorage.getItem('portal-mini')) fold(); } catch {}
render();
</script>
